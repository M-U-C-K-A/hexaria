<text class="c" x="447.55705045849464" y="452.8033988749895" font-size="17" font-weight="700" fill="#ece7d8">Roche</text></g><g class="pulse" style="animation-delay:1.35s"><circle cx="212.4429495415054" cy="446.8033988749895" r="40" fill="#f0cc2e" fill-opacity=".22" stroke="#f0cc2e" stroke-width="3"/><text class="c" x="212.4429495415054" y="452.8033988749895" font-size="17" font-weight="700" fill="#ece7d8">Foudre</text></g><g class="pulse" style="animation-delay:1.8s"><circle cx="139.7886967409693" cy="223.19660112501046" r="40" fill="#3fa9f5" fill-opacity=".22" stroke="#3fa9f5" stroke-width="3"/><text class="c" x="139.7886967409693" y="229.19660112501046" font-size="17" font-weight="700" fill="#ece7d8">Eau</text></g><g class="pulse" style="animation-delay:2.25s"><circle cx="330" cy="285" r="40" fill="#a070ff" fill-opacity=".22" stroke="#a070ff" stroke-width="3"/><text class="c" x="330" y="291" font-size="17" font-weight="700" fill="#ece7d8">Ombre</text></g><text x="640" y="120" font-size="24" font-weight="700" fill="#e2a93e">Qui domine qui ?</text>
<text class="s" x="640" y="156" font-size="15" fill="#ece7d8">Une flèche A → B : A domine B.</text>
<text class="s" x="640" y="190" font-size="15" fill="#7affc0" font-weight="700">▲ ×1,5  super efficace</text>
<text class="s" x="640" y="216" font-size="15" fill="#e0524a" font-weight="700">▼ ×0,7  peu efficace</text>
<text class="s" x="640" y="262" font-size="14" fill="#9fb0a8">Plante domine Eau et Roche · Eau domine Feu</text>
<text class="s" x="640" y="284" font-size="14" fill="#9fb0a8">et Roche · Feu domine Plante · Foudre domine</text>
<text class="s" x="640" y="306" font-size="14" fill="#9fb0a8">Eau · Roche domine Feu et Foudre · Ombre ne</text>
<text class="s" x="640" y="328" font-size="14" fill="#9fb0a8">domine que l'Ombre.</text>
<text class="s" x="640" y="376" font-size="14" fill="#9fb0a8">2 ou 4 créatures différentes du même type sur</text>
<text class="s" x="640" y="398" font-size="14" fill="#9fb0a8">le plateau activent une synergie d'équipe.</text>
</svg>

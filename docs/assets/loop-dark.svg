<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 292" width="1200" height="292" role="img" aria-label="Boucle de jeu : tour de gestion, événement, arène, récompense, boss">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7affc0" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<style>
text{font-family:'Cinzel','Palatino Linotype','Book Antiqua',Georgia,serif}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.c{text-anchor:middle}
.flow{stroke-dasharray:6 8;animation:flow 1.4s linear infinite}@keyframes flow{to{stroke-dashoffset:-14}}
.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}animate,animateMotion,animateTransform{display:none}}
</style>
<g class="pulse" style="animation-delay:0s"><path d="M175.0 126.0L130.0 152.0L85.0 126.0L85.0 74.0L130.0 48.0L175.0 74.0Z" fill="rgba(255,255,255,0.05)" stroke="#e2a93e" stroke-width="2"/><text class="c" x="130" y="108" font-size="26" font-weight="700" fill="#e2a93e">1</text></g>
<text class="c" x="130" y="188" font-size="17" font-weight="700" fill="#ece7d8">Tour de gestion</text><text class="s c" x="130" y="210" font-size="12.5" fill="#9fb0a8">bâtir · récolter · loger</text><path class="flow" d="M192 100H303" fill="none" stroke="#7affc0" stroke-width="2" marker-end="url(#ar)"/><g class="pulse" style="animation-delay:0.5s"><path d="M410.0 126.0L365.0 152.0L320.0 126.0L320.0 74.0L365.0 48.0L410.0 74.0Z" fill="rgba(255,255,255,0.05)" stroke="#e2a93e" stroke-width="2"/><text class="c" x="365" y="108" font-size="26" font-weight="700" fill="#e2a93e">2</text></g>
<text class="c" x="365" y="188" font-size="17" font-weight="700" fill="#ece7d8">Événement ?</text><text class="s c" x="365" y="210" font-size="12.5" fill="#9fb0a8">un choix, une surprise</text><path class="flow" d="M427 100H538" fill="none" stroke="#7affc0" stroke-width="2" marker-end="url(#ar)"/><g class="pulse" style="animation-delay:1s"><path d="M645.0 126.0L600.0 152.0L555.0 126.0L555.0 74.0L600.0 48.0L645.0 74.0Z" fill="rgba(255,255,255,0.05)" stroke="#e2a93e" stroke-width="2"/><text class="c" x="600" y="108" font-size="26" font-weight="700" fill="#e2a93e">3</text></g>
<text class="c" x="600" y="188" font-size="17" font-weight="700" fill="#ece7d8">Arène</text><text class="s c" x="600" y="210" font-size="12.5" fill="#9fb0a8">auto-battler hexagonal</text><path class="flow" d="M662 100H773" fill="none" stroke="#7affc0" stroke-width="2" marker-end="url(#ar)"/><g class="pulse" style="animation-delay:1.5s"><path d="M880.0 126.0L835.0 152.0L790.0 126.0L790.0 74.0L835.0 48.0L880.0 74.0Z" fill="rgba(255,255,255,0.05)" stroke="#e2a93e" stroke-width="2"/><text class="c" x="835" y="108" font-size="26" font-weight="700" fill="#e2a93e">4</text></g>
<text class="c" x="835" y="188" font-size="17" font-weight="700" fill="#ece7d8">Récompense</text><text class="s c" x="835" y="210" font-size="12.5" fill="#9fb0a8">relique · compagnon · œuf</text><path class="flow" d="M897 100H1008" fill="none" stroke="#7affc0" stroke-width="2" marker-end="url(#ar)"/><g class="pulse" style="animation-delay:2s"><path d="M1115.0 126.0L1070.0 152.0L1025.0 126.0L1025.0 74.0L1070.0 48.0L1115.0 74.0Z" fill="rgba(255,255,255,0.05)" stroke="#e0524a" stroke-width="2"/><text class="c" x="1070" y="108" font-size="26" font-weight="700" fill="#e0524a">5</text></g>
<text class="c" x="1070" y="188" font-size="17" font-weight="700" fill="#ece7d8">Boss final</text><text class="s c" x="1070" y="210" font-size="12.5" fill="#9fb0a8">Vermithrax, dragon des marais</text><path class="flow" d="M835 232q-340 44 -705 0" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.6" marker-end="url(#ar)" style="animation-direction:normal"/>
<text class="s c" x="482.5" y="268" font-size="13" fill="#9fb0a8">3 arènes, puis le boss : 22 tours en 4 actes. Une défaite coûte un cœur ♥ (3 au départ).</text>
<circle r="7" fill="#ffd98a"><animateMotion dur="10s" repeatCount="indefinite" path="M130 100H1070"/></circle>
</svg>

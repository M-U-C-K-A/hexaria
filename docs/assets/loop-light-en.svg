<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 292" width="1200" height="292" role="img" aria-label="Management turn → Event ? → Arena → Reward → Boss → Adventure ∞">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#0b8a73" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text{font-family:'Cinzel','Trajan Pro','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.c{text-anchor:middle}.e{text-anchor:end}
.flow{stroke-dasharray:6 8;animation:flow 1.4s linear infinite}@keyframes flow{to{stroke-dashoffset:-14}}.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g class="pulse" style="animation-delay:0s"><path d="M145.0 126.0L100.0 152.0L55.0 126.0L55.0 74.0L100.0 48.0L145.0 74.0Z" fill="rgba(40,70,60,0.11)" stroke="#8d5c0a" stroke-width="2"/><text class="c" x="100" y="109" font-size="27" font-weight="700" fill="#8d5c0a">1</text></g>
<text class="c" x="100" y="188" font-size="17" font-weight="700" fill="#1b2823">Management turn</text><text class="s c" x="100" y="210" font-size="12.5" fill="#566761">build · harvest · house</text><path class="flow" d="M162 100H228" fill="none" stroke="#0b8a73" stroke-width="2" marker-end="url(#ar)"/><g class="pulse" style="animation-delay:0.5s"><path d="M335.0 126.0L290.0 152.0L245.0 126.0L245.0 74.0L290.0 48.0L335.0 74.0Z" fill="rgba(40,70,60,0.11)" stroke="#8d5c0a" stroke-width="2"/><text class="c" x="290" y="109" font-size="27" font-weight="700" fill="#8d5c0a">2</text></g>
<text class="c" x="290" y="188" font-size="17" font-weight="700" fill="#1b2823">Event ?</text><text class="s c" x="290" y="210" font-size="12.5" fill="#566761">one choice, one surprise</text><path class="flow" d="M352 100H418" fill="none" stroke="#0b8a73" stroke-width="2" marker-end="url(#ar)"/><g class="pulse" style="animation-delay:1s"><path d="M525.0 126.0L480.0 152.0L435.0 126.0L435.0 74.0L480.0 48.0L525.0 74.0Z" fill="rgba(40,70,60,0.11)" stroke="#8d5c0a" stroke-width="2"/><text class="c" x="480" y="109" font-size="27" font-weight="700" fill="#8d5c0a">3</text></g>
<text class="c" x="480" y="188" font-size="17" font-weight="700" fill="#1b2823">Arena</text><text class="s c" x="480" y="210" font-size="12.5" fill="#566761">hexagonal auto-battler</text><path class="flow" d="M542 100H608" fill="none" stroke="#0b8a73" stroke-width="2" marker-end="url(#ar)"/><g class="pulse" style="animation-delay:1.5s"><path d="M715.0 126.0L670.0 152.0L625.0 126.0L625.0 74.0L670.0 48.0L715.0 74.0Z" fill="rgba(40,70,60,0.11)" stroke="#8d5c0a" stroke-width="2"/><text class="c" x="670" y="109" font-size="27" font-weight="700" fill="#8d5c0a">4</text></g>
<text class="c" x="670" y="188" font-size="17" font-weight="700" fill="#1b2823">Reward</text><text class="s c" x="670" y="210" font-size="12.5" fill="#566761">relic · companion · egg</text><path class="flow" d="M732 100H798" fill="none" stroke="#0b8a73" stroke-width="2" marker-end="url(#ar)"/><g class="pulse" style="animation-delay:2s"><path d="M905.0 126.0L860.0 152.0L815.0 126.0L815.0 74.0L860.0 48.0L905.0 74.0Z" fill="rgba(40,70,60,0.11)" stroke="#d0443c" stroke-width="2"/><text class="c" x="860" y="109" font-size="27" font-weight="700" fill="#d0443c">5</text></g>
<text class="c" x="860" y="188" font-size="17" font-weight="700" fill="#1b2823">Boss</text><text class="s c" x="860" y="210" font-size="12.5" fill="#566761">Vermithrax, the marsh dragon</text><path class="flow" d="M922 100H1008" fill="none" stroke="#0b8a73" stroke-width="2" marker-end="url(#ar)"/><g class="pulse" style="animation-delay:2.5s"><path d="M1115.0 126.0L1070.0 152.0L1025.0 126.0L1025.0 74.0L1070.0 48.0L1115.0 74.0Z" fill="rgba(40,70,60,0.11)" stroke="#0b8a73" stroke-width="2"/><text class="c" x="1070" y="109" font-size="27" font-weight="700" fill="#0b8a73">∞</text></g>
<text class="c" x="1070" y="188" font-size="17" font-weight="700" fill="#1b2823">Adventure ∞</text><text class="s c" x="1070" y="210" font-size="12.5" fill="#566761">generated tiers, Guardians</text><path class="flow" d="M670 232q-290 44 -570 0" fill="none" stroke="rgba(40,70,60,0.28)" stroke-width="1.6" marker-end="url(#ar)"/>
<text class="s c" x="600" y="268" font-size="13" fill="#566761">3 arenas, then the boss: 22 turns in 4 acts. A defeat costs a heart ♥ (you start with 3). After Vermithrax, the adventure goes on.</text>
<circle r="7" fill="#d9a33a"><animateMotion dur="11s" repeatCount="indefinite" path="M100 100H1070"/></circle>
</svg>

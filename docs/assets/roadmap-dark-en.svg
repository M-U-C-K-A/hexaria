<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="v0.1.0 Prototype, v0.2.0 Painted sprites, v0.3 Adventure mode, v0.4 Items &amp; traits, v1.0 Ages &amp; technologies">
<defs></defs>
<style>
text{font-family:'Cinzel','Trajan Pro','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.c{text-anchor:middle}.e{text-anchor:end}
.flow{stroke-dasharray:6 8;animation:flow 1.4s linear infinite}@keyframes flow{to{stroke-dashoffset:-14}}
.done{stroke-dasharray:240;stroke-dashoffset:240;animation:done 1.8s cubic-bezier(.3,.7,.2,1) .2s forwards}@keyframes done{to{stroke-dashoffset:0}}
.halo{animation:halo 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes halo{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.9);opacity:0}}
.in{opacity:0;animation:in .8s ease-out forwards}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<line x1="360" y1="96" x2="1080" y2="96" class="flow" stroke="rgba(255,255,255,0.2)" stroke-width="2.4"/>
